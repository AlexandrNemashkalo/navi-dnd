# Terminal NaviDnD.app (Alacritty 0.17): window without buttons macOS exactly under the game grid 150 × 63; transparent strip
# header (Buttonless) - the window is dragged behind it. The game substitutes the font, entire screen, background and window position when
# startup (MacApp.TerminalArguments) - from your settings and according to screen size.

[general]
live_config_reload = false

[env]
TERM = "xterm-256color"

[window]
decorations = "Buttonless"
dimensions = { columns = 150, lines = 63 }
padding = { x = 0, y = 0 }
dynamic_padding = false
resize_increments = false
option_as_alt = "Both"
title = "NaviDnD"
dynamic_title = false
startup_mode = "Windowed"

[scrolling]
history = 0

[font]
normal = { family = "Menlo", style = "Regular" }
size = 12.0
builtin_box_drawing = true

[colors.primary]
background = "#000000"
foreground = "#c0c0c0"

[cursor]
style = { shape = "Block", blinking = "Never" }

[mouse]
hide_when_typing = false

[keyboard]
# Extras for the game: new windows and tabs, search, cleaning, changing the size and the whole screen (the game grid is fixed).
# ⌘ or Ctrl with “+”/“−” - world map scale: the terminal would simply transmit “=”/“-”, therefore - as Ctrl+ “=”/“-” (CSI u).
bindings = [
  { key = "N", mods = "Command", action = "None" },
  { key = "T", mods = "Command", action = "None" },
  { key = "K", mods = "Command", action = "None" },
  { key = "F", mods = "Command", action = "None" },
  { key = "B", mods = "Command", action = "None" },
  { key = "F", mods = "Command|Control", action = "None" },
  { key = "0", mods = "Command", action = "None" },
  { key = "=", mods = "Command", chars = "\u001b[61;5u" },
  { key = "+", mods = "Command", chars = "\u001b[61;5u" },
  { key = "+", mods = "Command|Shift", chars = "\u001b[61;5u" },
  { key = "NumpadAdd", mods = "Command", chars = "\u001b[61;5u" },
  { key = "-", mods = "Command", chars = "\u001b[45;5u" },
  { key = "NumpadSubtract", mods = "Command", chars = "\u001b[45;5u" },
  { key = "=", mods = "Control", chars = "\u001b[61;5u" },
  { key = "+", mods = "Control", chars = "\u001b[61;5u" },
  { key = "+", mods = "Control|Shift", chars = "\u001b[61;5u" },
  { key = "NumpadAdd", mods = "Control", chars = "\u001b[61;5u" },
  { key = "-", mods = "Control", chars = "\u001b[45;5u" },
  { key = "NumpadSubtract", mods = "Control", chars = "\u001b[45;5u" },
]
