# Dedicated game configuration; does not import or modify the player's terminal settings.
[window]
dimensions = { columns = 150, lines = 63 }
title = "NaviDnD"
dynamic_title = false
# Keep Winit's standard non-client/minimize handling; the game removes the visible frame.
decorations = "Full"
dynamic_padding = true

[font]
normal = { family = "Consolas", style = "Regular" }
size = 10.0
# Initial fallback. The game measures actual cells before revealing the window and
# after font changes, then adjusts its session offset to an exact 1:2 cell ratio.
offset = { x = 0, y = -1 }
# Align font glyphs with the terminal's built-in lines without changing cell size.
glyph_offset = { x = 0, y = 1 }

[colors.primary]
background = "#121216"
foreground = "#b8c8ae"

[scrolling]
history = 0

# The game controls caret visibility; keep the terminal caret steady.
[cursor]
style = { shape = "Block", blinking = "Never" }

# Invisible before the game initializes; input fields restore a visible caret with OSC 12.
[colors.cursor]
text = "#121216"
cursor = "#121216"

[keyboard]
# Scale the whole fixed grid through game settings, not the font inside an unchanged window.
# Ctrl +/- belongs to world-map zoom, as on macOS.
bindings = [
  { key = "F11", mods = "None", chars = "\u001b[23~" },
  { key = "F12", mods = "None", chars = "\u001b[24~" },
  { key = "0", mods = "Control", action = "None" },
  { key = "=", mods = "Control", chars = "\u001b[61;5u" },
  { key = "+", mods = "Control", chars = "\u001b[61;5u" },
  { key = "+", mods = "Control|Shift", chars = "\u001b[61;5u" },
  { key = "NumpadAdd", mods = "Control", chars = "\u001b[61;5u" },
  { key = "-", mods = "Control", chars = "\u001b[45;5u" },
  { key = "NumpadSubtract", mods = "Control", chars = "\u001b[45;5u" },
]
