include:
  - local: .gitlab/alacritty-ci.yml

publish-release:
  image: curlimages/curl:8.12.1
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - .gitlab-ci.yml
        - .gitlab/release.json
  script:
    # macOS: archive of the base for players (link “macOS” in the release) - glued parts of releases-macos/, once per version of the base.
    - |
      if [ -f releases-macos/base-version.txt ]; then
        version=$(tr -d ' \r\n' < releases-macos/base-version.txt)
        package="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/NaviDnD-macOS/$version/NaviDnD-macOS-arm64-$version.zip"
        if curl --silent --fail --range 0-0 --output /dev/null --header "JOB-TOKEN: $CI_JOB_TOKEN" "$package"; then
          echo "macOS archive $version already published."
        else
          cat releases-macos/NaviDnD-macOS-payload.* > NaviDnD-macOS.zip
          curl --silent --show-error --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file NaviDnD-macOS.zip "$package"
          echo "macOS archive $version published."
        fi
      fi
    - |
      status=$(curl --silent --show-error --output release-response.json --write-out '%{http_code}' \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" --header "Content-Type: application/json" \
        --data @.gitlab/release.json "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases")
      case "$status" in
        201) echo "Release published." ;;
        409) echo "Release already exists; no changes needed." ;;
        *) cat release-response.json; exit 1 ;;
      esac
