publish-release:
  image: curlimages/curl:8.12.1
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - .gitlab-ci.yml
        - .gitlab/release.json
  script:
    - |
      status=$(curl --silent --show-error --output release-response.json --write-out '%{http_code}' \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" --header "Content-Type: application/json" \
        --data @.gitlab/release.json "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases")
      case "$status" in
        201) echo "Release published." ;;
        409) echo "Release already exists; no changes needed." ;;
        *) cat release-response.json; exit 1 ;;
      esac
